<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protis - Unblocked Games</title>
    <meta name="description" content="Minimalist unblocked games portal with a glassy aesthetic, shooting stars background, icon-only navigation, and high-performance iframe loading." />
    <meta property="og:title" content="Protis - Unblocked Games" />
    <meta property="og:description" content="Minimalist unblocked games portal with a glassy aesthetic, shooting stars background, icon-only navigation, and high-performance iframe loading." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/app.css" />
    <style>
      /* Immediate critical styles to eliminate blank white flashes on GitHub Pages */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #060913;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }
      .preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0d1527 0%, #060913 100%);
        z-index: 9999;
        padding: 16px;
      }
      .preloader-card {
        width: 100%;
        max-width: 320px;
        padding: 36px 32px;
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(6, 182, 212, 0.15);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .preloader-title {
        font-size: 42px;
        font-weight: 900;
        letter-spacing: -0.04em;
        background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 4px 0;
        user-select: none;
      }
      .preloader-sub {
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 20px;
        font-weight: 500;
      }
      .preloader-bar-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        margin-bottom: 18px;
      }
      .preloader-bar-bg {
        flex: 1;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .preloader-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #06b6d4, #3b82f6);
        border-radius: 9999px;
        animation: preloader-slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes preloader-slide {
        0% { left: -50%; width: 40%; }
        50% { width: 60%; }
        100% { left: 110%; width: 40%; }
      }
      .preloader-skip-btn {
        padding: 5px 12px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 700;
        color: #f8fafc;
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.15);
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        outline: none;
        flex-shrink: 0;
      }
      .preloader-skip-btn:hover {
        background: rgba(51, 65, 85, 0.95);
        border-color: rgba(6, 182, 212, 0.6);
        transform: scale(1.06);
      }
      .preloader-skip-btn:active {
        transform: scale(0.96);
      }
      .preloader-tip-card {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 14px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        text-align: center;
      }
      .preloader-tip-label {
        font-size: 9px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #64748b;
        margin-bottom: 2px;
      }
      .preloader-tip-text {
        font-size: 12px;
        font-weight: 600;
        color: #67e8f9;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant inline loading screen (visible instantly prior to JS execution) -->
      <div class="preloader" id="static-preloader">
        <div class="preloader-card">
          <h1 class="preloader-title">Protis</h1>
          <div class="preloader-sub" id="preloader-sub">Initializing unblocked portal...</div>
          
          <!-- Loading bar with Skip button right next to it -->
          <div class="preloader-bar-row">
            <div class="preloader-bar-bg">
              <div class="preloader-bar"></div>
            </div>
            <button
              type="button"
              class="preloader-skip-btn"
              id="static-skip-btn"
              onclick="var p = document.getElementById('static-preloader'); if (p) p.remove();"
              title="Skip loading screen"
            >
              Skip ➔
            </button>
          </div>

          <!-- Randomized tip card -->
          <div class="preloader-tip-card">
            <div class="preloader-tip-label">Tip</div>
            <div class="preloader-tip-text" id="preloader-tip">"Loading..."</div>
          </div>

          <script>
            (function() {
              try {
                var tips = [
                  "Mason H is that you?",
                  "Ik Zander is here",
                  "Money Spread",
                  "Scool sux",
                  "was that rushing or dragging",
                  "GEODASH REFERENCE"
                ];
                var t = tips[Math.floor(Math.random() * tips.length)];
                var tipEl = document.getElementById('preloader-tip');
                if (tipEl) tipEl.textContent = '"' + t + '"';
              } catch(e) {}
            })();
          </script>
        </div>
      </div>
    </div>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
