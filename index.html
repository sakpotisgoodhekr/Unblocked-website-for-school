<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>protis - Unblocked Games</title>
    <meta name="description" content="Minimalist unblocked games portal with a glassy aesthetic, shooting stars background, icon-only navigation, and high-performance iframe loading." />
    <meta property="og:title" content="protis - Unblocked Games" />
    <meta property="og:description" content="Minimalist unblocked games portal with a glassy aesthetic, shooting stars background, icon-only navigation, and high-performance iframe loading." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      /* Immediate critical styles to eliminate blank white flashes on GitHub */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #060913;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }
      .preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0d1527 0%, #060913 100%);
        z-index: 9999;
      }
      .preloader-card {
        padding: 40px 48px;
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(6, 182, 212, 0.15);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .preloader-title {
        font-size: 42px;
        font-weight: 900;
        letter-spacing: -0.04em;
        background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 8px 0;
      }
      .preloader-sub {
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 24px;
        font-weight: 500;
      }
      .preloader-bar-bg {
        width: 180px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .preloader-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #06b6d4, #3b82f6);
        border-radius: 9999px;
        animation: preloader-slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes preloader-slide {
        0% { left: -50%; width: 40%; }
        50% { width: 60%; }
        100% { left: 110%; width: 40%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- High-fidelity inline loading screen (visible instantly prior to JS execution) -->
      <div class="preloader" id="static-preloader">
        <div class="preloader-card">
          <h1 class="preloader-title">protis</h1>
          <div class="preloader-sub">Initializing unblocked portal...</div>
          <div class="preloader-bar-bg">
            <div class="preloader-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
