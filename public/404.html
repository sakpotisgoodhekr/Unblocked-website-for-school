<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to protis...</title>
  <script>
    // GitHub Pages SPA redirect
    var path = window.location.pathname;
    var base = path.split('/')[1] ? '/' + path.split('/')[1] + '/' : '/';
    window.location.replace(base);
  </script>
</head>
<body style="background-color: #060913; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;">
  <p>Loading protis...</p>
</body>
</html>
